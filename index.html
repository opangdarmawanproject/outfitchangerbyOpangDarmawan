<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Movie Cinematic Style Changer</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #121212; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 30px 10px; 
            margin: 0;
        }
        h1 { text-align: center; color: #f39c12; font-size: 1.8rem; }
        .container { 
            background: #1e1e1e; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.6); 
            text-align: center; 
            max-width: 500px; 
            width: 100%; 
        }
        select, input[type="file"], button { 
            margin: 10px 0; 
            padding: 12px; 
            width: 100%; 
            border-radius: 8px; 
            border: 1px solid #333; 
            font-size: 16px; 
            box-sizing: border-box; 
            background: #2a2a2a;
            color: white;
        }
        button { 
            background-color: #f39c12; 
            color: #121212; 
            cursor: pointer; 
            font-weight: bold; 
            border: none;
            transition: all 0.3s ease; 
        }
        button:hover { background-color: #e67e22; transform: scale(1.02); }
        #downloadBtn { background-color: #27ae60; color: white; display: none; }
        #downloadBtn:hover { background-color: #219150; }
        canvas { 
            max-width: 100%; 
            margin-top: 20px; 
            border: 2px solid #444; 
            border-radius: 8px; 
            display: none; 
        }
        .note { font-size: 13px; color: #aaa; margin-top: 20px; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎬 Movie Style Changer</h1>
    <p>Unggah fotomu dan ubah nuansanya menjadi ala film Box Office!</p>

    <input type="file" id="imageUpload" accept="image/*">

    <select id="movieSelect">
        <option value="matrix">1. The Matrix (Hacker Green Code)</option>
        <option value="barbie">2. Barbie (Dreamhouse Pink)</option>
        <option value="madmax">3. Mad Max (Wasteland Dust)</option>
        <option value="mib">4. Men in Black (Agent Grayscale)</option>
        <option value="potter">5. Harry Potter (Magical Warm Vintage)</option>
        <option value="starwars">6. Star Wars (Jedi Blue/Red)</option>
        <option value="oppenheimer">7. Oppenheimer (Cinematic B&W)</option>
        <option value="jurassic">8. Jurassic Park (Jungle Green)</option>
        <option value="tron">9. Tron: Legacy (Neon Cyan)</option>
        <option value="godfather">10. The Godfather (Mobster Sepia)</option>
    </select>

    <button id="applyBtn">Terapkan Gaya Film</button>
    <button id="downloadBtn">Unduh Hasil Foto</button>

    <canvas id="canvas"></canvas>

    <p class="note"><b>Info Teknis:</b> Aplikasi ini menggunakan manipulasi piksel HTML5 Canvas untuk filter warna, bukan model AI Generatif (yang membutuhkan server backend & API Key berbayar).</p>
</div>

<script>
    const imageUpload = document.getElementById('imageUpload');
    const movieSelect = document.getElementById('movieSelect');
    const applyBtn = document.getElementById('applyBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let uploadedImg = new Image();

    // Membaca file gambar
    imageUpload.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                uploadedImg.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }
    });

    // Menerapkan filter
    applyBtn.addEventListener('click', function() {
        if (!uploadedImg.src) {
            alert("Silakan unggah foto terlebih dahulu!");
            return;
        }

        // Setup ukuran canvas menyesuaikan foto asli
        canvas.width = uploadedImg.width;
        canvas.height = uploadedImg.height;
        canvas.style.display = 'block';
        downloadBtn.style.display = 'block';

        // Gambar foto asli ke canvas
        ctx.drawImage(uploadedImg, 0, 0);

        const movieStyle = movieSelect.value;
        applyCinematicFilter(movieStyle);
    });

    function applyCinematicFilter(style) {
        // Ambil data piksel
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;

        // Loop melalui setiap piksel untuk mengubah warna (RGB)
        for (let i = 0; i < data.length; i += 4) {
            let r = data[i];
            let g = data[i + 1];
            let b = data[i + 2];

            if (style === 'matrix') {
                data[i] = r * 0.3;       // Kurangi merah
                data[i+1] = g * 1.6;     // Tingkatkan hijau (tint The Matrix)
                data[i+2] = b * 0.3;     // Kurangi biru
            } else if (style === 'barbie') {
                data[i] = r * 1.4;       // Merah jambu cerah
                data[i+1] = g * 0.8;
                data[i+2] = b * 1.2;
            } else if (style === 'madmax') {
                data[i] = r * 1.4;       // Oranye gurun
                data[i+1] = g * 1.0;
                data[i+2] = b * 0.4;
            } else if (style === 'mib') {
                let avg = (r + g + b) / 3;
                data[i] = data[i+1] = data[i+2] = avg * 1.1; // Hitam putih tajam
            } else if (style === 'oppenheimer') {
                let avg = (r + g + b) / 3;
                data[i] = data[i+1] = data[i+2] = avg * 0.8; // B&W gelap sinematik
            } else if (style === 'potter') {
                data[i] = r * 1.2;       // Vintage / Sepia hangat
                data[i+1] = g * 1.0;
                data[i+2] = b * 0.7;
            } else if (style === 'starwars') {
                data[i] = r * 0.5;
                data[i+1] = g * 0.7;
                data[i+2] = b * 1.6;     // Sci-fi Blue
            } else if (style === 'jurassic') {
                data[i] = r * 0.8;
                data[i+1] = g * 1.3;     // Hijau rimba
                data[i+2] = b * 0.6;
            } else if (style === 'tron') {
                data[i] = r * 0.3;
                data[i+1] = g * 1.4;
                data[i+2] = b * 1.6;     // Neon Cyan
            } else if (style === 'godfather') {
                // Formula warna Sepia klasik
                data[i] = (r * 0.393) + (g * 0.769) + (b * 0.189);
                data[i+1] = (r * 0.349) + (g * 0.686) + (b * 0.168);
                data[i+2] = (r * 0.272) + (g * 0.534) + (b * 0.131);
            }
        }
        
        // Kembalikan piksel yang sudah diubah ke canvas
        ctx.putImageData(imageData, 0, 0);

        // Tambahkan Teks ala Poster Film di bagian bawah foto
        const fontSize = Math.max(canvas.width * 0.04, 20);
        ctx.fillStyle = "white";
        ctx.font = `bold ${fontSize}px Arial`;
        ctx.textAlign = "center";
        ctx.shadowColor = "rgba(0,0,0,0.8)";
        ctx.shadowBlur = 15;
        
        const textOptions = movieSelect.options[movieSelect.selectedIndex].text.split('(')[0].trim();
        ctx.fillText(`STYLE: ${textOptions.toUpperCase()}`, canvas.width / 2, canvas.height - (fontSize));
    }

    // Fitur Unduh Foto
    downloadBtn.addEventListener('click', function() {
        const link = document.createElement('a');
        link.download = 'Cinematic_Movie_Style.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    });
</script>
</body>
</html>
