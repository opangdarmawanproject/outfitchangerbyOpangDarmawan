<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Main Dulu Sebentar - Tetris</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f4e1d2;
            background-image: radial-gradient(#d5bdaf 1px, transparent 1px);
            background-size: 20px 20px;
            margin: 0;
            overflow: hidden; /* Prevent scrolling on mobile */
            touch-action: none; /* Prevent pinch zoom */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .title-font {
            font-family: 'Fredoka One', cursive;
        }

        .game-container {
            background-color: #fffaf0;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(139, 90, 43, 0.2), inset 0 0 0 8px #eaddcf;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 100%;
            max-height: 100%;
        }

        canvas {
            background-color: #fdf6e3;
            border-radius: 12px;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.05);
            border: 2px solid #d5bdaf;
        }

        .btn {
            transition: all 0.2s ease;
            box-shadow: 0 4px 0 #b38b6d;
        }
        
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #b38b6d;
        }

        .glass-overlay {
            background: rgba(255, 250, 240, 0.85);
            backdrop-filter: blur(5px);
        }

        /* Mobile controls grid */
        .mobile-controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        
        .control-btn {
            background-color: #eaddcf;
            border: 2px solid #d5bdaf;
            border-radius: 12px;
            padding: 15px 0;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #8b5a2b;
            user-select: none;
        }

        .control-btn:active {
            background-color: #d5bdaf;
        }

        @media (min-width: 768px) {
            .game-wrapper {
                flex-direction: row;
            }
            .mobile-controls {
                display: none;
            }
        }
        @media (max-width: 767px) {
            .game-wrapper {
                flex-direction: column;
                align-items: center;
            }
            canvas#tetris {
                height: 50vh;
                width: auto;
            }
        }
    </style>
</head>
<body>

    <div class="game-container relative">
        
        <!-- Header -->
        <div class="text-center">
            <h1 class="title-font text-3xl md:text-4xl text-[#8b5a2b]">☕ Main Dulu Sebentar</h1>
            <p class="text-sm text-[#b38b6d] font-bold mt-1">Santai aja, kerjaan nggak akan lari.</p>
        </div>

        <!-- Game Area -->
        <div class="game-wrapper flex gap-4">
            <!-- Left: Main Canvas -->
            <div class="relative">
                <canvas id="tetris" width="300" height="600"></canvas>
                
                <!-- Modals / Overlays -->
                <div id="start-modal" class="absolute inset-0 glass-overlay rounded-xl flex flex-col justify-center items-center z-10 p-4 text-center">
                    <h2 class="title-font text-2xl text-[#8b5a2b] mb-4">Siap Refreshing?</h2>
                    <p class="text-[#8b5a2b] mb-6">Selesaikan 30 Baris (3 Level) untuk menang!</p>
                    <button onclick="startGame()" class="btn bg-[#a3c9a8] hover:bg-[#8eb893] text-white title-font py-3 px-8 rounded-xl text-xl">Mulai Main</button>
                </div>

                <div id="pause-modal" class="absolute inset-0 glass-overlay rounded-xl flex flex-col justify-center items-center z-10 hidden">
                    <h2 class="title-font text-3xl text-[#8b5a2b] mb-6">Jeda Dulu ⏸️</h2>
                    <button onclick="togglePause()" class="btn bg-[#f4a261] hover:bg-[#e76f51] text-white title-font py-3 px-8 rounded-xl text-xl">Lanjut</button>
                </div>

                <div id="gameover-modal" class="absolute inset-0 glass-overlay rounded-xl flex flex-col justify-center items-center z-10 hidden">
                    <h2 class="title-font text-3xl text-[#e76f51] mb-2">Yah, Penuh!</h2>
                    <p class="text-[#8b5a2b] mb-6 font-bold">Level Mentok: <span id="final-level"></span></p>
                    <button onclick="resetGame()" class="btn bg-[#eaddcf] hover:bg-[#d5bdaf] text-[#8b5a2b] title-font py-3 px-8 rounded-xl text-xl">Ulangi Lagi</button>
                </div>

                <div id="tamat-modal" class="absolute inset-0 glass-overlay rounded-xl flex flex-col justify-center items-center z-10 hidden p-4 text-center">
                    <h2 class="title-font text-4xl text-[#a3c9a8] mb-2">TAMAT! 🎉</h2>
                    <p class="text-[#8b5a2b] mb-6 font-bold">Kamu berhasil melewati 3 Level.<br>Sekarang balik kerja (atau main lagi)!</p>
                    <button onclick="resetGame()" class="btn bg-[#8b5a2b] hover:bg-[#6c4622] text-white title-font py-3 px-8 rounded-xl text-xl">Main Lagi</button>
                </div>
            </div>

            <!-- Right: Stats & Controls -->
            <div class="flex flex-col gap-4 w-full md:w-32">
                
                <!-- Next Piece -->
                <div class="bg-[#fdf6e3] p-3 rounded-xl border-2 border-[#d5bdaf] flex flex-col items-center">
                    <p class="text-xs text-[#8b5a2b] font-bold mb-2 uppercase tracking-wide">Selanjutnya</p>
                    <canvas id="next-piece" width="90" height="90"></canvas>
                </div>

                <!-- Stats -->
                <div class="bg-[#fdf6e3] p-3 rounded-xl border-2 border-[#d5bdaf]">
                    <div class="mb-3">
                        <p class="text-xs text-[#b38b6d] font-bold uppercase">Skor</p>
                        <p id="score-display" class="title-font text-xl text-[#8b5a2b]">0</p>
                    </div>
                    <div class="mb-3">
                        <p class="text-xs text-[#b38b6d] font-bold uppercase">Baris</p>
                        <p id="lines-display" class="title-font text-xl text-[#8b5a2b]">0</p>
                    </div>
                    <div>
                        <p class="text-xs text-[#b38b6d] font-bold uppercase">Level (Max 3)</p>
                        <p id="level-display" class="title-font text-2xl text-[#e76f51]">1</p>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex flex-row md:flex-col gap-2">
                    <button onclick="togglePause()" class="btn flex-1 bg-[#f4a261] text-white font-bold py-2 px-4 rounded-xl">⏸️ Pause</button>
                    <button onclick="resetGame()" class="btn flex-1 bg-[#eaddcf] text-[#8b5a2b] font-bold py-2 px-4 rounded-xl">🔄 Ulangi</button>
                </div>

            </div>
        </div>

        <!-- Mobile Controls (Visible only on small screens) -->
        <div class="mobile-controls">
            <button class="control-btn" id="btn-left">⬅️</button>
            <button class="control-btn" id="btn-rotate">🔃</button>
            <button class="control-btn" id="btn-right">➡️</button>
            <div style="grid-column: span 3;">
                <button class="control-btn" id="btn-down" style="width: 100%;">⬇️ Turun</button>
            </div>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        const nextCanvas = document.getElementById('next-piece');
        const nextContext = nextCanvas.getContext('2d');

        // Scaling for crisp rendering
        context.scale(30, 30);
        nextContext.scale(30, 30);

        const COLS = 10;
        const ROWS = 20;
        
        // Colors corresponding to tetrominoes (Pastel aesthetic)
        const COLORS = [
            null,
            '#a8d8ea', // I - Cyan pastel
            '#aa96da', // J - Purple pastel
            '#fcbad3', // L - Pink pastel
            '#ffffd2', // O - Yellow pastel
            '#a3c9a8', // S - Green pastel
            '#f4a261', // T - Orange pastel
            '#e76f51'  // Z - Red/Coral pastel
        ];

        const PIECES = [
            [],
            // I
            [
                [0, 1, 0, 0],
                [0, 1, 0, 0],
                [0, 1, 0, 0],
                [0, 1, 0, 0],
            ],
            // J
            [
                [0, 2, 0],
                [0, 2, 0],
                [2, 2, 0],
            ],
            // L
            [
                [0, 3, 0],
                [0, 3, 0],
                [0, 3, 3],
            ],
            // O
            [
                [4, 4],
                [4, 4],
            ],
            // S
            [
                [0, 5, 5],
                [5, 5, 0],
                [0, 0, 0],
            ],
            // T
            [
                [0, 0, 0],
                [6, 6, 6],
                [0, 6, 0],
            ],
            // Z
            [
                [7, 7, 0],
                [0, 7, 7],
                [0, 0, 0],
            ],
        ];

        let board = createMatrix(COLS, ROWS);
        let player = {
            pos: {x: 0, y: 0},
            matrix: null,
        };
        let nextPiece = null;
        
        let dropCounter = 0;
        let dropInterval = 1000; // Base speed
        let lastTime = 0;
        let animationId;

        // Stats
        let score = 0;
        let lines = 0;
        let level = 1;

        // States
        let isPaused = false;
        let isGameOver = false;
        let isTamat = false;
        let gameStarted = false;

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }

        function createPiece(type) {
            return PIECES[type];
        }

        function drawMatrix(matrix, offset, ctx) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        ctx.fillStyle = COLORS[value];
                        // Add slight shadow/border for aesthetic
                        ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
                        ctx.lineWidth = 0.05;
                        ctx.strokeStyle = 'rgba(0,0,0,0.1)';
                        ctx.strokeRect(x + offset.x, y + offset.y, 1, 1);
                        
                        // Inner highlight
                        ctx.fillStyle = 'rgba(255,255,255,0.3)';
                        ctx.fillRect(x + offset.x, y + offset.y, 1, 0.1);
                        ctx.fillRect(x + offset.x, y + offset.y, 0.1, 1);
                    }
                });
            });
        }

        function collide(board, player) {
            const m = player.matrix;
            const o = player.pos;
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 &&
                       (board[y + o.y] && board[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        function merge(board, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        board[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        function clearLines() {
            let linesCleared = 0;
            outer: for (let y = board.length - 1; y >= 0; --y) {
                for (let x = 0; x < board[y].length; ++x) {
                    if (board[y][x] === 0) {
                        continue outer;
                    }
                }

                const row = board.splice(y, 1)[0].fill(0);
                board.unshift(row);
                ++y;
                linesCleared++;
            }

            if (linesCleared > 0) {
                // Scoring system
                let points = 0;
                if(linesCleared === 1) points = 100;
                if(linesCleared === 2) points = 300;
                if(linesCleared === 3) points = 500;
                if(linesCleared === 4) points = 800; // Tetris!
                
                score += points * level;
                lines += linesCleared;
                
                checkLevelUp();
                updateStatsUI();
            }
        }

        function checkLevelUp() {
            // Level constraints:
            // Level 1: 0-9 lines
            // Level 2: 10-19 lines
            // Level 3: 20-29 lines
            // 30 Lines = TAMAT
            
            if (lines >= 30) {
                triggerTamat();
            } else if (lines >= 20) {
                level = 3;
                dropInterval = 400; // Fast
            } else if (lines >= 10) {
                level = 2;
                dropInterval = 700; // Medium
            } else {
                level = 1;
                dropInterval = 1000; // Slow
            }
        }

        function triggerTamat() {
            isTamat = true;
            document.getElementById('tamat-modal').classList.remove('hidden');
            cancelAnimationFrame(animationId);
        }

        function triggerGameOver() {
            isGameOver = true;
            document.getElementById('final-level').innerText = level;
            document.getElementById('gameover-modal').classList.remove('hidden');
            cancelAnimationFrame(animationId);
        }

        function playerDrop() {
            if(isPaused || isGameOver || isTamat || !gameStarted) return;
            player.pos.y++;
            if (collide(board, player)) {
                player.pos.y--;
                merge(board, player);
                playerReset();
                clearLines();
            }
            dropCounter = 0;
        }

        function playerMove(offset) {
            if(isPaused || isGameOver || isTamat || !gameStarted) return;
            player.pos.x += offset;
            if (collide(board, player)) {
                player.pos.x -= offset;
            }
        }

        function playerReset() {
            if (nextPiece === null) {
                nextPiece = createPiece(Math.floor(Math.random() * 7) + 1);
            }
            
            player.matrix = nextPiece;
            player.pos.y = 0;
            player.pos.x = (Math.floor(COLS / 2)) - (Math.floor(player.matrix[0].length / 2));
            
            nextPiece = createPiece(Math.floor(Math.random() * 7) + 1);
            drawNextPiece();

            // Game Over check
            if (collide(board, player)) {
                triggerGameOver();
            }
        }

        function playerRotate() {
            if(isPaused || isGameOver || isTamat || !gameStarted) return;
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix);
            // Wall Kick logic
            while (collide(board, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -1); // Undo rotation
                    player.pos.x = pos;
                    return;
                }
            }
        }

        function rotate(matrix, dir = 1) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) {
                matrix.forEach(row => row.reverse());
            } else {
                matrix.reverse();
            }
        }

        function drawNextPiece() {
            nextContext.fillStyle = '#fdf6e3';
            nextContext.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
            
            // Center the next piece in the 3x3 (90px) canvas
            const offset = {
                x: 1.5 - nextPiece[0].length / 2,
                y: 1.5 - nextPiece.length / 2
            };
            drawMatrix(nextPiece, offset, nextContext);
        }

        function draw() {
            context.fillStyle = '#fdf6e3'; // Clear canvas
            context.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid lines (subtle)
            context.strokeStyle = 'rgba(213, 189, 175, 0.3)';
            context.lineWidth = 0.05;
            for(let i = 0; i <= COLS; i++) {
                context.beginPath(); context.moveTo(i, 0); context.lineTo(i, ROWS); context.stroke();
            }
            for(let i = 0; i <= ROWS; i++) {
                context.beginPath(); context.moveTo(0, i); context.lineTo(COLS, i); context.stroke();
            }

            drawMatrix(board, {x: 0, y: 0}, context);
            
            // Perbaikan: Pastikan matrix pemain sudah ada sebelum digambar
            if (player.matrix) {
                drawMatrix(player.matrix, player.pos, context);
            }
        }

        function update(time = 0) {
            if (!isPaused && !isGameOver && !isTamat && gameStarted) {
                const deltaTime = time - lastTime;
                dropCounter += deltaTime;
                if (dropCounter > dropInterval) {
                    playerDrop();
                }
            }
            
            lastTime = time;
            draw();
            animationId = requestAnimationFrame(update);
        }

        function updateStatsUI() {
            document.getElementById('score-display').innerText = score;
            document.getElementById('lines-display').innerText = lines;
            document.getElementById('level-display').innerText = level;
        }

        function startGame() {
            document.getElementById('start-modal').classList.add('hidden');
            if(!gameStarted) {
                resetGame();
                gameStarted = true;
                update();
            }
        }

        function togglePause() {
            if (isGameOver || isTamat || !gameStarted) return;
            isPaused = !isPaused;
            const modal = document.getElementById('pause-modal');
            if (isPaused) {
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
                lastTime = performance.now(); // Prevent large time jump
            }
        }

        function resetGame() {
            board = createMatrix(COLS, ROWS);
            score = 0;
            lines = 0;
            level = 1;
            dropInterval = 1000;
            isGameOver = false;
            isTamat = false;
            isPaused = false;
            
            document.getElementById('gameover-modal').classList.add('hidden');
            document.getElementById('tamat-modal').classList.add('hidden');
            document.getElementById('pause-modal').classList.add('hidden');
            
            updateStatsUI();
            nextPiece = null;
            playerReset();
        }

        document.addEventListener('keydown', event => {
            if(isPaused || isGameOver || isTamat || !gameStarted) return;
            switch (event.keyCode) {
                case 37: // Left
                    playerMove(-1);
                    break;
                case 39: // Right
                    playerMove(1);
                    break;
                case 40: // Down
                    playerDrop();
                    break;
                case 38: // Up / Rotate
                    playerRotate();
                    break;
            }
        });

        // Mobile Controls
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');
        const btnRotate = document.getElementById('btn-rotate');
        const btnDown = document.getElementById('btn-down');

        // Helper to prevent default touch behaviors (like zooming) on buttons
        const addTouchControl = (btn, action) => {
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                action();
            });
            // Fallback for mouse click on mobile view simulated in desktop
            btn.addEventListener('mousedown', (e) => {
                e.preventDefault();
                action();
            });
        };

        addTouchControl(btnLeft, () => playerMove(-1));
        addTouchControl(btnRight, () => playerMove(1));
        addTouchControl(btnRotate, () => playerRotate());
        
        // Continuous drop while holding down button
        let dropIntervalId;
        const startDrop = () => {
            playerDrop();
            dropIntervalId = setInterval(playerDrop, 100); // Fast drop
        };
        const stopDrop = () => clearInterval(dropIntervalId);

        btnDown.addEventListener('touchstart', (e) => { e.preventDefault(); startDrop(); });
        btnDown.addEventListener('touchend', (e) => { e.preventDefault(); stopDrop(); });
        btnDown.addEventListener('mousedown', (e) => { e.preventDefault(); startDrop(); });
        btnDown.addEventListener('mouseup', (e) => { e.preventDefault(); stopDrop(); });
        btnDown.addEventListener('mouseleave', (e) => { e.preventDefault(); stopDrop(); });

        // Initial draw behind modal
        draw();
    </script>
</body>
</html>
